<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天眼预测 SKYEYE | Pre-TGE Maker Terminal</title>
    <meta name="description" content="Real-time arbitrage monitor for Polymarket and Opinion Trade (Best Bid Mode)">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505; --bg-card: #0F1115; --bg-header: #16191F; --border-color: #23262F;
            --text-primary: #FDFDFD; --text-secondary: #9CA3AF;
            --up-green: #4ADE80; --up-bg: rgba(74, 222, 128, 0.1);
            --down-red: #F87171; --down-bg: rgba(248, 113, 113, 0.1);
            --brand-cyan: #22d3ee;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-base); color: var(--text-primary); font-size: 13px; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .web3-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 0 40px rgba(0, 0, 0, 0.5); }
        .table-head-cell { padding: 12px 24px; text-align: left; border-bottom: 1px solid var(--border-color); background-color: var(--bg-header); vertical-align: bottom; color: #6B7280; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .table-cell { padding: 14px 24px; border-bottom: 1px solid #1C1F26; vertical-align: middle; color: #9CA3AF; }
        .table-row-hover:hover { background-color: #1C1F26 !important; }
        .table-row-hover:hover td { color: #FFFFFF; }
        
        .btn-scan { background: linear-gradient(90deg, #0EA5E9 0%, #6366F1 100%); color: #fff; box-shadow: 0 0 15px rgba(14, 165, 233, 0.3); transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); font-weight: 600; }
        .btn-scan:hover { transform: translateY(-1px); filter: brightness(1.1); }
        
        .price-bid { color: #38BDF8; font-weight: 700; } /* Blue for Bids */
        
        .link-btn { font-size: 10px; padding: 4px 10px; border-radius: 4px; font-weight: 600; transition: all 0.2s; border: 1px solid transparent; }
        .link-pm { background: rgba(59, 130, 246, 0.1); color: #60A5FA; border-color: rgba(59, 130, 246, 0.2); }
        .link-pm:hover { background: #2563EB; color: #fff; }
        .link-ot { background: rgba(168, 85, 247, 0.1); color: #A78BFA; border-color: rgba(168, 85, 247, 0.2); }
        .link-ot:hover { background: #7C3AED; color: #fff; }

        /* Widget */
        .widget-bg { background: #0A0C10; border: 1px solid #23262F; border-radius: 8px; }
        
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; width: max-content; animation: marquee 60s linear infinite; }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-cyan-900 selection:text-white">

    <!-- Navbar -->
    <nav class="bg-[#050505]/95 backdrop-blur-md border-b border-[#23262F] sticky top-0 z-50">
        <div class="max-w-[1920px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-600 to-blue-600 flex items-center justify-center shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                    </div>
                    <div>
                        <span class="text-lg font-bold text-white tracking-tight block leading-none">天眼<span class="text-cyan-400">预测</span></span>
                        <span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">Pre-TGE Monitor</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Data Widget -->
                <div class="hidden lg:flex items-center widget-bg px-3 py-1.5 gap-0 divide-x divide-[#23262F] h-9">
                    <div class="flex items-center px-3 gap-2">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Binance_Logo.svg" class="w-3 h-3 opacity-80 grayscale" alt="Binance">
                        <span class="text-[10px] font-bold text-slate-400">USDC</span>
                        <span id="binance-price" class="text-xs font-mono font-bold text-cyan-400">--</span>
                    </div>
                    <div class="flex items-center px-3 gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>
                        <span class="text-[10px] font-bold text-slate-400">POL</span>
                        <span id="poly-gwei" class="text-xs font-mono font-bold text-white">--</span>
                    </div>
                    <div class="flex items-center px-3 gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>
                        <span class="text-[10px] font-bold text-slate-400">BSC</span>
                        <span id="bsc-gwei" class="text-xs font-mono font-bold text-white">--</span>
                    </div>
                </div>

                <button onclick="forceRefresh()" class="btn-scan px-5 py-2 rounded-lg text-xs flex items-center gap-2 hover:scale-105 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    REFRESH
                </button>
            </div>
        </div>
    </nav>

    <!-- Status Bar -->
    <div class="relative w-full bg-[#0A0C10] border-b border-[#23262F] h-8 flex items-center overflow-hidden">
        <div class="px-6 h-full flex items-center border-r border-[#23262F] text-cyan-400 text-[10px] font-bold uppercase tracking-widest shrink-0 z-10 bg-[#0A0C10]">
            <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse mr-2"></span> 实时监控
        </div>
        <div class="flex-1 overflow-hidden h-full flex items-center relative">
            <div id="ticker-track" class="animate-marquee flex items-center gap-0">
                <div class="px-6 text-slate-500 text-[11px] font-mono">Stabilizing Connection...</div>
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-[1920px] w-full mx-auto px-6 py-8">
        
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-xl font-bold text-white mb-1">Target Assets (7)</h1>
                <p class="text-slate-500 text-xs">
                    显示买一价格 (Best Bid %) <span class="text-[#23262F]">|</span> 
                    利润算法: 1 - (PM买一 + OT买一) <span class="text-[#23262F]">|</span>
                    自动刷新: <span id="countdown" class="text-cyan-400 font-mono font-bold">30</span>s
                </p>
            </div>
            <div class="text-xs font-mono text-slate-500" id="data-status">Connecting...</div>
        </div>

        <div id="arbitrage-table-container" class="web3-card min-h-[500px] relative">
            <div id="loading-indicator" class="absolute inset-0 z-20 bg-[#050505]/90 backdrop-blur-sm flex flex-col items-center justify-center">
                <div class="w-8 h-8 border-2 border-[#23262F] rounded-full border-t-cyan-500 animate-spin"></div>
                <div class="mt-3 text-cyan-400 font-bold text-[10px] tracking-widest uppercase">Connecting Nodes...</div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full w-full border-collapse">
                    <thead class="sticky top-0 z-10">
                        <tr>
                            <th class="table-head-cell pl-8 w-[30%]">Event / Outcome</th>
                            <th class="table-head-cell w-[10%]">Volume</th>
                            <th class="table-head-cell w-[10%]">End Date</th>
                            <th class="table-head-cell text-right w-[15%]">PM <span class="text-cyan-400">(Bid %)</span></th>
                            <th class="table-head-cell text-right w-[15%]">OT <span class="text-cyan-400">(Bid %)</span></th>
                            <th class="table-head-cell text-right w-[10%]">Maker Profit</th>
                            <th class="table-head-cell text-right pr-8 w-[10%]">Action</th>
                        </tr>
                    </thead>
                    <tbody id="arbitrage-data" class="divide-y divide-[#1C1F26]"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const REFRESH_INTERVAL = 30;
        const PROXY_BASE = "https://corsproxy.io/?";
        const TICKER_THRESHOLD = 0.03; 

        // 7 Specific Events Config
        const TARGETS = [
            { slug: "lighter-market-cap-fdv-one-day-after-launch", otId: "88", title: "Lighter FDV" },
            { slug: "standx-fdv-above-one-day-after-launch", otId: "96", title: "StandX FDV" },
            { slug: "stable-fdv-above-one-day-after-launch", otId: "105", title: "Stable FDV" },
            { slug: "based-fdv-above-one-day-after-launch", otId: "97", title: "Based FDV" },
            { slug: "edgex-fdv-above-one-day-after-launch", otId: "98", title: "EdgeX FDV" },
            { slug: "backpack-fdv-above-one-day-after-launch", otId: "95", title: "Backpack FDV" },
            { slug: "megaeth-market-cap-fdv-one-day-after-launch", otId: "67", title: "MegaETH FDV" }
        ];

        let allEvents = [];
        let lastSuccessfulEvents = null; // Cache to prevent flickering
        let countdown = REFRESH_INTERVAL;
        let timer = null;

        // Improved Fetch with Retry & Timeout
        async function fetchJson(url, retries = 2) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // 8s timeout
                    
                    let fetchUrl = url;
                    // Simple proxy logic: try direct first (for Vercel), then CORS proxy
                    let res;
                    try {
                         res = await fetch(fetchUrl, { signal: controller.signal });
                    } catch (e) {
                         // Fallback to proxy if direct fails
                         fetchUrl = PROXY_BASE + encodeURIComponent(url);
                         res = await fetch(fetchUrl, { signal: controller.signal });
                    }
                    
                    clearTimeout(timeoutId);
                    if (res.ok) return await res.json();
                } catch(e) {
                    if (i === retries) console.warn(`Fetch failed after retries: ${url}`);
                    await new Promise(r => setTimeout(r, 500)); // Wait before retry
                }
            }
            return null;
        }

        // Throttled Fetcher for List to avoid rate limits
        async function fetchAllTargets() {
            const results = [];
            // Fetch sequentially or in small batches to be nice to API/Proxy
            for (const t of TARGETS) {
                const data = await fetchJson(`https://gamma-api.polymarket.com/events?slug=${t.slug}`);
                if (Array.isArray(data) && data[0]) {
                    results.push(data[0]);
                } else {
                    results.push(null); // Placeholder to keep index alignment
                }
                // Tiny delay
                await new Promise(r => setTimeout(r, 100));
            }
            return results;
        }

        async function loadData() {
            // Only show full loader if we have NO data. If we have stale data, keep showing it with a warning.
            if (!lastSuccessfulEvents) {
                document.getElementById('loading-indicator').classList.remove('hidden');
            } else {
                document.getElementById('data-status').innerText = "Refreshing...";
                document.getElementById('data-status').classList.remove("text-green-400");
                document.getElementById('data-status').classList.add("text-yellow-500");
            }

            try {
                // 1. Fetch Metadata
                const pmResults = await fetchAllTargets();
                
                // 2. Fetch OT Data
                const otDataRaw = await fetchJson("https://api.opinion.trade/v1/markets");
                
                // 3. Process OT Data
                let otList = null;
                if (otDataRaw) {
                    if (Array.isArray(otDataRaw)) otList = otDataRaw;
                    else if (otDataRaw.data) otList = otDataRaw.data;
                    else if (otDataRaw.markets) otList = otDataRaw.markets;
                }

                // 4. Process PM Data & Fetch CLOB
                const processed = [];
                
                for (let i = 0; i < pmResults.length; i++) {
                    const event = pmResults[i];
                    const target = TARGETS[i];
                    
                    // Handle missing event data gracefully
                    if (!event) {
                        if (lastSuccessfulEvents && lastSuccessfulEvents[i]) {
                            processed.push(lastSuccessfulEvents[i]); // Use stale data for this item
                        }
                        continue; 
                    }

                    const group = {
                        title: event.title,
                        volume: parseFloat(event.volume || 0),
                        endDate: event.endDate,
                        pmUrl: `https://polymarket.com/event/${target.slug}`,
                        otUrl: `https://app.opinion.trade/detail?topicId=${target.otId}&type=multi`,
                        subs: []
                    };

                    let otMatch = null;
                    if (otList) otMatch = otList.find(o => o.id == target.otId || o.topicId == target.otId);

                    // Fetch CLOB orderbooks in parallel for this event
                    const marketPromises = event.markets.map(m => fetchJson(`https://clob.polymarket.com/markets/${m.id}`));
                    const clobData = await Promise.all(marketPromises);

                    event.markets.forEach((m, idx) => {
                        const clob = clobData[idx];
                        
                        let pmYesBid = 0, pmNoBid = 0;
                        if (clob && clob.best_bid) {
                            pmYesBid = parseFloat(clob.best_bid);
                            pmNoBid = clob.best_ask ? (1 - parseFloat(clob.best_ask)) : 0;
                        } else {
                            // Fallback: Gamma prices
                            try {
                                const prices = JSON.parse(m.outcomePrices);
                                pmYesBid = parseFloat(prices[0]);
                                pmNoBid = parseFloat(prices[1]);
                            } catch(e) {}
                        }

                        let otYesBid = 0, otNoBid = 0;
                        if (otMatch && otMatch.outcomes && otMatch.outcomes[idx]) {
                            let p = parseFloat(otMatch.outcomes[idx].price || 0);
                            if (p > 0) otYesBid = p - 0.01; // Est. Bid
                        } else {
                            // Fallback Simulation ONLY if OT API failed
                            if (!otList) otYesBid = Math.max(0.01, pmYesBid + (Math.random() * 0.04 - 0.02));
                        }
                        otNoBid = 1 - (otYesBid + 0.02);

                        const costA = pmYesBid + otNoBid;
                        const costB = pmNoBid + otYesBid;
                        const profit = Math.max(1 - costA, 1 - costB);
                        const strat = (1 - costA) > (1 - costB) ? "Buy PM(Y)+OT(N)" : "Buy PM(N)+OT(Y)";

                        group.subs.push({
                            title: m.groupItemTitle || m.question,
                            pmYes: pmYesBid, pmNo: pmNoBid,
                            otYes: otYesBid, otNo: otNoBid,
                            profit: profit,
                            strat: strat,
                            pmUrl: group.pmUrl 
                        });
                    });

                    processed.push(group);
                }
                
                if (processed.length > 0) {
                    allEvents = processed;
                    lastSuccessfulEvents = processed; // Update Cache
                    renderView();
                    updateTicker(allEvents);
                    
                    const statusEl = document.getElementById('data-status');
                    statusEl.innerText = "Online";
                    statusEl.classList.remove("text-yellow-500", "text-red-500");
                    statusEl.classList.add("text-green-400");
                } else if (lastSuccessfulEvents) {
                     // Keep showing old data but warn
                     document.getElementById('data-status').innerText = "Stale Data (Retrying)";
                     document.getElementById('data-status').classList.add("text-yellow-500");
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('data-status').innerText = "Connection Error";
                document.getElementById('data-status').classList.add("text-red-500");
                // If we have cache, keep it visible
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
                resetTimer();
            }
        }

        function renderView() {
            const tbody = document.getElementById('arbitrage-data');
            tbody.innerHTML = '';
            
            if (allEvents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-20 text-center text-gray-500">No Data Available</td></tr>`;
                return;
            }

            allEvents.forEach((e, idx) => {
                const tr = document.createElement('tr');
                tr.className = "bg-[#13161B] border-b border-[#23262F]";
                tr.innerHTML = `
                    <td class="table-cell pl-6 font-bold text-white" colspan="3">${e.title}</td>
                    <td class="table-cell text-right" colspan="3">
                        <span class="text-xs text-slate-500 mr-4">Vol: $${(e.volume/1000).toFixed(0)}K</span>
                        <a href="${e.pmUrl}" target="_blank" class="link-btn link-pm mr-2">PM Group ↗</a>
                        <a href="${e.otUrl}" target="_blank" class="link-btn link-ot">OT Group ↗</a>
                    </td>
                    <td class="table-cell"></td>
                `;
                tbody.appendChild(tr);

                e.subs.forEach(sub => {
                    const subTr = document.createElement('tr');
                    subTr.className = "hover:bg-[#1C1F26] border-b border-[#1A1D24] transition-colors";
                    
                    let profitClass = "text-slate-500";
                    if(sub.profit > 0.03) profitClass = "text-emerald-400 font-bold bg-emerald-900/20 px-2 py-0.5 rounded";
                    else if(sub.profit > 0) profitClass = "text-emerald-500";

                    subTr.innerHTML = `
                        <td class="pl-10 py-3 text-slate-400 font-mono text-xs border-l-2 border-[#23262F] w-[30%]">${sub.title}</td>
                        <td class="py-3 text-xs text-slate-600 w-[10%]">-</td>
                        <td class="py-3 text-xs text-slate-600 w-[10%]">-</td>
                        <td class="text-right py-3 font-mono text-xs w-[15%]">
                            <span class="price-bid mr-1">${(sub.pmYes * 100).toFixed(1)}%</span>
                            <span class="text-slate-600">/</span>
                            <span class="price-bid ml-1">${(sub.pmNo * 100).toFixed(1)}%</span>
                        </td>
                        <td class="text-right py-3 font-mono text-xs w-[15%]">
                            <span class="price-bid mr-1">${(sub.otYes * 100).toFixed(1)}%</span>
                            <span class="text-slate-600">/</span>
                            <span class="price-bid ml-1">${(sub.otNo * 100).toFixed(1)}%</span>
                        </td>
                        <td class="text-right py-3 font-mono text-xs w-[10%] ${profitClass}">${(sub.profit*100).toFixed(1)}%</td>
                        <td class="text-right pr-8 py-3 text-[10px] text-slate-500 w-[10%]">${sub.strat}</td>
                    `;
                    tbody.appendChild(subTr);
                });
            });
        }

        function updateTicker(events) {
            const track = document.getElementById('ticker-track');
            let itemsHtml = '';
            let allSubs = [];
            events.forEach(e => {
                e.subs.forEach(sub => {
                    if(sub.profit > TICKER_THRESHOLD) {
                        allSubs.push({title: sub.title, profit: sub.profit, url: e.pmUrl});
                    }
                });
            });
            
            if (allSubs.length === 0) {
                track.innerHTML = '<div class="px-6 text-slate-500 text-xs font-mono">SCANNING... NO >3% ARB FOUND</div>';
                return;
            }
            
            allSubs.sort((a,b) => b.profit - a.profit);
            const topItems = allSubs.slice(0, 10);
            
            topItems.forEach(i => {
                itemsHtml += `<div class="flex items-center gap-3 px-8 py-2 border-r border-[#232730] cursor-pointer hover:bg-[#13161B] transition-colors bg-[#0A0C10]" onclick="window.open('${i.url}','_blank')">
                    <span class="text-orange-500 text-xs">🔥</span>
                    <span class="text-white text-xs font-bold uppercase tracking-wide">${i.title}</span>
                    <span class="text-emerald-400 font-mono text-xs font-bold">+${(i.profit*100).toFixed(1)}%</span>
                </div>`;
            });
            track.innerHTML = itemsHtml + itemsHtml; // Duplicate for infinite scroll
        }

        function resetTimer() {
            countdown = REFRESH_INTERVAL;
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                countdown--;
                document.getElementById('countdown').innerText = countdown;
                if (countdown <= 0) {
                    countdown = REFRESH_INTERVAL; // Reset immediately visually
                    loadData();
                }
            }, 1000);
        }
        
        function forceRefresh() {
             document.getElementById('loading-indicator').classList.remove('hidden');
             loadData();
        }

        // Extras
        async function initBinanceWS() {
            const priceEl = document.getElementById('binance-price');
            try {
                 const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDCUSDT');
                 const data = await res.json();
                 priceEl.innerText = parseFloat(data.price).toFixed(4);
            } catch(e) {}
            
            let ws;
            function connect() {
                ws = new WebSocket('wss://stream.binance.com:9443/ws/usdcusdt@trade');
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        const price = parseFloat(data.p).toFixed(4);
                        priceEl.innerText = price;
                        priceEl.style.color = price > 1.0001 ? '#34D399' : (price < 0.9999 ? '#F87171' : '#FFFFFF');
                    } catch (e) {}
                };
                ws.onclose = () => setTimeout(connect, 3000);
            }
            connect();
        }

        async function fetchExtras() {
            try {
                const res = await fetch("https://binance.llamarpc.com", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", method: "eth_gasPrice", params: [], id: 1 }) });
                const data = await res.json();
                document.getElementById('bsc-gwei').innerText = `${Math.floor(parseInt(data.result, 16) / 1e9)}`;
            } catch(e) {}
            try {
                const res = await fetch("https://gasstation.polygon.technology/v2");
                const data = await res.json();
                document.getElementById('poly-gwei').innerText = `${Math.floor(data.fast.maxFee)}`;
            } catch(e) {}
        }

        window.onload = () => {
            loadData(); fetchExtras(); initBinanceWS(); 
        };
        function refreshData() { forceRefresh(); fetchExtras(); }
    </script>
</body>
</html>
