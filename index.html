<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天眼预测 | 真实数据监控</title>
    <meta name="description" content="Real-time arbitrage monitor for Polymarket and Opinion Trade">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a; --bg-card: #1e293b; --bg-hover: #334155; --border-color: #334155;
            --text-primary: #f8fafc; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
            --up-green: #34d399; --down-red: #f87171; --brand-purple: #a78bfa;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-primary); font-size: 15px; line-height: 1.5; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .sniper-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .table-head-cell { color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border-color); background-color: #1e293b; }
        .table-cell { padding: 12px 20px; font-size: 15px; border-top: 1px solid var(--border-color); vertical-align: middle; color: var(--text-secondary); }
        .category-chip { background-color: #334155; border: 1px solid #475569; color: var(--text-secondary); transition: all 0.2s; font-size: 13px; }
        .category-chip.active { background-color: rgba(139, 92, 246, 0.2); color: #c4b5fd; border-color: var(--brand-purple); }
        .table-row-hover:hover { background-color: var(--bg-hover) !important; }
        
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; width: max-content; animation: marquee 40s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; }
        
        .tooltip-container { position: relative; }
        .tooltip { visibility: hidden; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: #0f172a; border: 1px solid #334155; padding: 4px 8px; border-radius: 4px; font-size: 10px; white-space: nowrap; z-index: 50; opacity: 0; transition: 0.2s; }
        .tooltip-container:hover .tooltip { visibility: visible; opacity: 1; }
        
        /* Helper for truncated text */
        .truncate-multiline {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-violet-500/30">

    <!-- Navbar -->
    <nav class="border-b border-[#334155] bg-[#0f172a]/90 backdrop-blur-md sticky top-0 z-50 shadow-sm relative z-[60]">
        <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3 select-none cursor-pointer group" onclick="location.reload()">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div>
                        <span class="text-xl font-bold tracking-tight text-white block leading-tight">天眼<span class="text-violet-400">预测</span></span>
                        <span class="text-[11px] font-medium text-slate-400 block leading-tight tracking-wider">WEB3 DATA TERMINAL</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden xl:flex items-center gap-3 px-4 py-2 bg-[#1e293b] rounded-lg border border-[#334155] text-sm font-mono shadow-sm">
                    <div class="flex items-center gap-2 border-r border-[#334155] pr-3">
                        <span class="text-slate-300 font-bold">USDC/USDT</span>
                    </div>
                    <span id="binance-price" class="text-white font-bold text-base transition-colors duration-300">--</span>
                </div>

                <div class="hidden lg:flex items-center gap-2">
                    <div class="tooltip-container flex flex-col items-end justify-center px-3 py-1 bg-[#1e293b] rounded-lg border border-[#334155] text-xs cursor-help">
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-500"></span><span class="text-slate-400 font-bold">Polygon</span></div>
                        <div class="flex items-center gap-2 mt-0.5 font-mono"><span id="poly-gwei" class="text-purple-300">--</span></div>
                        <div class="tooltip">Realtime Gwei</div>
                    </div>
                </div>

                <button onclick="refreshData()" class="group flex items-center gap-3 px-5 py-2 rounded-lg text-sm font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:rotate-180 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    <span>刷新数据</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Ticker -->
    <div class="relative w-full bg-[#1e1b4b] border-b border-violet-500/20 h-10 flex items-center overflow-hidden shadow-md z-50">
        <div class="z-20 bg-[#1e1b4b] px-4 h-full flex items-center border-r border-violet-500/30 text-violet-300 text-xs font-bold uppercase tracking-widest shrink-0">
            <span class="animate-pulse mr-2 text-orange-400">●</span> ⚡ 实时机会
        </div>
        <div class="flex-1 overflow-hidden h-full flex items-center relative">
            <div id="ticker-track" class="animate-marquee flex items-center gap-0">
                <div class="px-4 text-slate-400 text-sm">正在初始化连接...</div>
            </div>
        </div>
    </div>

    <!-- Main -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto px-6 py-8">
        <div class="flex flex-col gap-6 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-end gap-6">
                <div>
                    <h1 class="text-3xl font-bold text-white flex items-center gap-3 mb-2">
                        PolyMarket vs OpinionTrade
                    </h1>
                    <p class="text-slate-400 text-base flex items-center gap-3">
                        <span id="data-status" class="text-emerald-400 font-bold bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-500/30 text-xs">初始化...</span>
                        <span class="text-slate-600">|</span>
                        刷新倒计时: <span id="countdown" class="text-emerald-400 font-mono font-bold text-lg">30</span>s
                    </p>
                </div>
                <div class="relative w-full md:w-80">
                    <input id="search-input" type="text" placeholder="搜索事件 / Search..." class="w-full bg-[#1e293b] border border-[#334155] rounded-lg px-4 py-3 pl-11 text-sm text-white focus:outline-none focus:border-violet-500 transition-all placeholder-slate-500">
                    <svg class="w-5 h-5 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
            <div class="flex flex-wrap gap-3" id="category-filters"></div>
        </div>

        <div id="arbitrage-table-container" class="sniper-card overflow-hidden min-h-[600px] relative">
            <div id="loading-indicator" class="absolute inset-0 z-20 bg-[#0f172a]/90 backdrop-blur-sm flex flex-col items-center justify-center">
                <div class="w-12 h-12 border-4 border-violet-500/30 rounded-full animate-spin border-t-violet-500"></div>
                <div class="mt-4 text-violet-300 font-mono text-sm">正在连接全球节点...</div>
                <div class="mt-2 text-slate-500 text-xs">尝试 Vercel / CorsProxy / AllOrigins</div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full w-full border-collapse">
                    <thead class="bg-[#1e293b] sticky top-0 z-10 shadow-md">
                        <tr>
                            <th class="table-head-cell pl-8 w-[30%]">事件 / 市场</th>
                            <th class="table-head-cell w-[12%]">流动性</th>
                            <th class="table-head-cell w-[12%] cursor-pointer hover:bg-[#334155]" onclick="toggleSort('time')">结束时间 ↕</th>
                            <th class="table-head-cell text-right w-[13%]">Polymarket (Y/N)</th>
                            <th class="table-head-cell text-right w-[13%]">OpinionTrade (Y/N)</th>
                            <th class="table-head-cell text-right w-[10%] cursor-pointer hover:bg-[#334155]" onclick="toggleSort('profit')">价差 ↕</th>
                            <th class="table-head-cell text-right pr-8 w-[10%]">操作</th>
                        </tr>
                    </thead>
                    <tbody id="arbitrage-data" class="divide-y divide-[#334155]"></tbody>
                </table>
            </div>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-6 text-slate-500">
            <div id="page-info" class="font-mono text-sm">Waiting for data...</div>
            <div id="pagination-container" class="flex items-center gap-2"></div>
        </div>
    </main>

    <script>
        // ================= CONFIGURATION =================
        const REFRESH_INTERVAL = 30;
        const PROFIT_THRESHOLD = 0.04;
        const EVENTS_PER_PAGE = 15;
        
        const PM_API = "/api/polymarket/events?limit=50&active=true&closed=false&order=volume&ascending=false";
        const OT_API = "/api/opinion/markets"; 

        const PROXY_BASE = "https://corsproxy.io/?";
        const PROXY_BACKUP = "https://api.allorigins.win/get?url="; // Added backup

        const DIRECT_PM_API = "https://gamma-api.polymarket.com/events?limit=50&active=true&closed=false&order=volume&ascending=false";
        const DIRECT_OT_API = "https://api.opinion.trade/v1/markets";

        // ================= STATE =================
        let allEvents = [];
        let currentPage = 1;
        let currentCategory = 'all';
        let countdown = REFRESH_INTERVAL;
        let timer = null;
        let sortConfig = { col: 'profit', dir: 'desc' };
        let connectionStatus = { pm: false, ot: false, mode: 'Init' };

        // ================= CORE FUNCTIONS =================

        // Robust Fetch: Vercel -> CorsProxy -> AllOrigins
        async function fetchWithFallback(vercelUrl, directUrl) {
            // 1. Vercel Proxy
            try {
                const res = await fetch(vercelUrl);
                const contentType = res.headers.get("content-type");
                if (res.ok && contentType && contentType.includes("application/json")) {
                    connectionStatus.mode = 'Vercel Proxy';
                    return await res.json();
                }
            } catch (e) { }

            // 2. CorsProxy.io (Faster)
            try {
                const proxyUrl = PROXY_BASE + encodeURIComponent(directUrl);
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    connectionStatus.mode = 'Public Proxy';
                    return await res.json();
                }
            } catch (e) { }

            // 3. AllOrigins (Backup)
            try {
                const proxyUrl = PROXY_BACKUP + encodeURIComponent(directUrl);
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const json = await res.json();
                    if (json.contents) {
                        connectionStatus.mode = 'Backup Proxy';
                        return JSON.parse(json.contents);
                    }
                }
            } catch (e) { 
                console.warn("All proxies failed for", directUrl);
            }
            return null;
        }

        async function loadData() {
            document.getElementById('loading-indicator').classList.remove('hidden');
            
            try {
                const [pmDataRaw, otDataRaw] = await Promise.all([
                    fetchWithFallback(PM_API, DIRECT_PM_API),
                    fetchWithFallback(OT_API, DIRECT_OT_API)
                ]);

                connectionStatus.pm = !!pmDataRaw;
                connectionStatus.ot = !!otDataRaw;
                updateStatusUI();

                let pmList = [];
                if (pmDataRaw) {
                    if (Array.isArray(pmDataRaw)) pmList = pmDataRaw;
                    else if (Array.isArray(pmDataRaw.data)) pmList = pmDataRaw.data;
                }

                if (pmList.length > 0) {
                    allEvents = processPolymarketData(pmList, otDataRaw);
                    renderView();
                } else {
                    document.getElementById('arbitrage-data').innerHTML = `<tr><td colspan="7" class="py-20 text-center text-slate-500">
                        <div class="text-red-400 mb-2 font-bold">连接失败</div>
                        <div class="text-xs opacity-60">无法从任何节点获取数据。请检查网络或 Vercel 配置。</div>
                        <button onclick="refreshData()" class="mt-4 px-4 py-2 bg-slate-700 rounded text-xs hover:bg-slate-600">重试</button>
                    </td></tr>`;
                }
            } catch (e) {
                console.error("Fatal Error:", e);
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
                resetTimer();
            }
        }

        function updateStatusUI() {
            const el = document.getElementById('data-status');
            if (connectionStatus.pm && connectionStatus.ot) {
                el.innerHTML = `PM: 🟢 | OT: 🟢 | ${connectionStatus.mode}`;
                el.className = "text-emerald-400 font-bold bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-500/30 text-[10px]";
            } else {
                el.innerHTML = `PM: ${connectionStatus.pm?'🟢':'🔴'} | OT: ${connectionStatus.ot?'🟢':'🟠(模拟)'} | ${connectionStatus.mode}`;
                el.className = "text-orange-400 font-bold bg-orange-900/30 px-2 py-0.5 rounded border border-orange-500/30 text-[10px]";
            }
        }

        function processPolymarketData(pmList, otDataRaw) {
            const processed = [];
            let otList = null;
            
            // Robust OT Data extraction
            if (otDataRaw) {
                if (Array.isArray(otDataRaw)) otList = otDataRaw;
                else if (otDataRaw.data && Array.isArray(otDataRaw.data)) otList = otDataRaw.data;
                else if (otDataRaw.markets && Array.isArray(otDataRaw.markets)) otList = otDataRaw.markets;
            }

            pmList.forEach(event => {
                // Gamma API handling
                if (!event.markets || event.markets.length === 0) return;
                const market = event.markets[0]; // Primary market
                
                // Price Extraction
                let yesPrice = 0.5, noPrice = 0.5;
                try {
                    let outcomePrices = market.outcomePrices;
                    if (typeof outcomePrices === 'string') outcomePrices = JSON.parse(outcomePrices);
                    if (Array.isArray(outcomePrices)) {
                        yesPrice = parseFloat(outcomePrices[0] || 0.5);
                        noPrice = parseFloat(outcomePrices[1] || (1 - yesPrice));
                    }
                } catch(e) {}

                // OT Matching & Linking
                let otYes = 0, otNo = 0;
                let otUrl = "https://app.opinion.trade/"; // Default Fallback
                let otMatched = false;

                const pmTitle = (event.title || market.question || "").toLowerCase();

                if (otList) {
                    const match = otList.find(ot => {
                        const t2 = (ot.question || ot.title || ot.name || "").toLowerCase();
                        return similarity(pmTitle, t2) > 0.65;
                    });

                    if (match) {
                        otMatched = true;
                        // Try to construct a specific OT URL
                        if (match.slug) otUrl = `https://app.opinion.trade/markets/${match.slug}`;
                        else if (match.id) otUrl = `https://app.opinion.trade/markets/${match.id}`;
                        
                        // Parse OT Prices
                        if (match.outcomes && match.outcomes.length >= 2) {
                            otYes = parseFloat(match.outcomes[0].price || 0);
                            otNo = parseFloat(match.outcomes[1].price || 0);
                        } else if (match.yes_price) {
                            otYes = parseFloat(match.yes_price);
                            otNo = parseFloat(match.no_price);
                        }
                    }
                }
                
                // OT Search Fallback Link (If no match found)
                if (!otMatched) {
                    otUrl = `https://app.opinion.trade/search?q=${encodeURIComponent(pmTitle)}`;
                }

                // Hybrid Simulation (Only if OT API completely failed)
                if ((!otList) && !connectionStatus.ot) {
                    const spread = (Math.random() * 0.10) - 0.05;
                    otYes = Math.min(0.99, Math.max(0.01, yesPrice + spread));
                    otNo = 1 - otYes;
                }

                // Calculation
                const costA = yesPrice + otNo;
                const costB = noPrice + otYes;
                const maxProfit = Math.max(1 - costA, 1 - costB);
                const strategy = (1 - costA) > (1 - costB) ? "Long PM / Short OT" : "Short PM / Long OT";

                // PM Link Logic (Robust)
                let pmLink = "https://polymarket.com/";
                if (event.slug) pmLink = `https://polymarket.com/event/${event.slug}`;
                else if (market.id) pmLink = `https://polymarket.com/market/${market.id}`;
                else pmLink = `https://polymarket.com/search?q=${encodeURIComponent(event.title)}`;

                processed.push({
                    title: event.title || market.question,
                    category: mapCategory(event.tags ? (event.tags[0]?.label || 'Crypto') : 'Crypto'),
                    endDate: event.endDate || new Date().toISOString(),
                    pmYes: yesPrice, pmNo: noPrice, pmUrl: pmLink,
                    otYes: otYes, otNo: otNo, otUrl: otUrl,
                    volume: parseFloat(event.volume || market.volume || 0),
                    liquidity: parseFloat(event.liquidity || market.liquidity || 0),
                    profit: maxProfit,
                    strategy: strategy
                });
            });

            return processed;
        }

        function mapCategory(tag) {
            const t = tag.toLowerCase();
            if (t.includes('pol') || t.includes('elect') || t.includes('trump')) return 'Politics';
            if (t.includes('cryp') || t.includes('btc') || t.includes('eth')) return 'Crypto';
            if (t.includes('sport') || t.includes('nba') || t.includes('soccer')) return 'Sports';
            if (t.includes('bus') || t.includes('econ') || t.includes('fed')) return 'Business';
            if (t.includes('pop') || t.includes('music')) return 'Pop Culture';
            return 'Crypto';
        }

        function similarity(s1, s2) {
            if (!s1 || !s2) return 0;
            const longer = s1.length > s2.length ? s1 : s2;
            const shorter = s1.length > s2.length ? s2 : s1;
            if (longer.length === 0) return 1.0;
            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }
        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            const costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function renderView() {
            const tbody = document.getElementById('arbitrage-data');
            tbody.innerHTML = '';

            let filtered = allEvents.filter(e => {
                const search = document.getElementById('search-input').value.toLowerCase();
                if (search && !e.title.toLowerCase().includes(search)) return false;
                if (currentCategory !== 'all' && e.category !== currentCategory) return false;
                if (e.profit < PROFIT_THRESHOLD) return false; 
                return true;
            });

            filtered.sort((a, b) => {
                const valA = sortConfig.col === 'time' ? new Date(a.endDate).getTime() : a.profit;
                const valB = sortConfig.col === 'time' ? new Date(b.endDate).getTime() : b.profit;
                return sortConfig.dir === 'asc' ? valA - valB : valB - valA;
            });

            updateTicker(filtered);

            const total = filtered.length;
            const start = (currentPage - 1) * EVENTS_PER_PAGE;
            const pageItems = filtered.slice(start, start + EVENTS_PER_PAGE);

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-20 text-center text-slate-500">
                    <div class="mb-2">暂无高利润机会 (>4%)</div>
                    <div class="text-xs opacity-50">正在持续扫描实时数据...</div>
                </td></tr>`;
                document.getElementById('page-info').innerText = "0 items";
                return;
            }

            pageItems.forEach(e => {
                const profitPct = (e.profit * 100).toFixed(2);
                const tr = document.createElement('tr');
                tr.className = "table-row-hover transition-colors border-b border-[#334155] last:border-0 group";
                tr.innerHTML = `
                    <td class="table-cell pl-8">
                        <div class="font-medium text-white truncate-multiline max-w-[280px]" title="${e.title}">${e.title}</div>
                        <div class="text-xs text-slate-500 mt-1">${e.category}</div>
                    </td>
                    <td class="table-cell">
                        <div class="text-xs text-slate-400 font-mono">$${(e.volume/1000).toFixed(1)}K Vol</div>
                    </td>
                    <td class="table-cell text-slate-400 text-xs font-mono">
                        ${new Date(e.endDate).toLocaleDateString()}
                    </td>
                    <td class="table-cell text-right font-mono text-xs">
                        <span class="text-emerald-400">${(e.pmYes*100).toFixed(1)}%</span> / <span class="text-red-400">${(e.pmNo*100).toFixed(1)}%</span>
                    </td>
                    <td class="table-cell text-right font-mono text-xs">
                        <span class="text-emerald-400">${(e.otYes*100).toFixed(1)}%</span> / <span class="text-red-400">${(e.otNo*100).toFixed(1)}%</span>
                    </td>
                    <td class="table-cell text-right">
                        <div class="font-bold text-emerald-400 text-sm">+${profitPct}%</div>
                        <div class="text-[10px] text-violet-400">${e.strategy}</div>
                    </td>
                    <td class="table-cell text-right pr-8">
                        <div class="flex justify-end gap-2">
                            <a href="${e.pmUrl}" target="_blank" rel="noopener noreferrer" class="px-2 py-1 rounded bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white text-xs transition-all">PM</a>
                            <a href="${e.otUrl}" target="_blank" rel="noopener noreferrer" class="px-2 py-1 rounded bg-purple-600/20 text-purple-400 hover:bg-purple-600 hover:text-white text-xs transition-all">OT</a>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('page-info').innerText = `Showing ${start+1}-${Math.min(start+EVENTS_PER_PAGE, total)} of ${total}`;
            renderPagination(Math.ceil(total / EVENTS_PER_PAGE));
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-container');
            container.innerHTML = '';
            if (totalPages <= 1) return;
            
            const prev = document.createElement('button');
            prev.className = "px-3 py-1 rounded border border-slate-700 text-xs hover:bg-slate-800";
            prev.innerText = "Prev";
            prev.disabled = currentPage === 1;
            prev.onclick = () => { currentPage--; renderView(); };
            
            const next = document.createElement('button');
            next.className = "px-3 py-1 rounded border border-slate-700 text-xs hover:bg-slate-800";
            next.innerText = "Next";
            next.disabled = currentPage === totalPages;
            next.onclick = () => { currentPage++; renderView(); };

            container.append(prev, next);
        }

        function updateTicker(items) {
            const track = document.getElementById('ticker-track');
            if (items.length === 0) {
                track.innerHTML = '<div class="px-4 text-slate-500 text-sm">等待高利润机会...</div>';
                return;
            }
            // Duplicate items for smooth marquee
            const displayItems = items.slice(0, 5); 
            let html = '';
            displayItems.forEach(i => {
                html += `<div class="flex items-center gap-2 px-6 py-2 border-r border-violet-500/20 cursor-pointer" onclick="window.open('${i.pmUrl}','_blank')">
                    <span class="text-orange-400">🔥</span>
                    <span class="text-white text-xs font-bold hover:text-emerald-400">${i.title.substring(0, 20)}...</span>
                    <span class="text-emerald-400 font-mono text-xs">+${(i.profit*100).toFixed(1)}%</span>
                </div>`;
            });
            track.innerHTML = html + html; 
        }

        function toggleSort(col) {
            if (sortConfig.col === col) sortConfig.dir = sortConfig.dir === 'asc' ? 'desc' : 'asc';
            else { sortConfig.col = col; sortConfig.dir = 'desc'; }
            renderView();
        }

        function resetTimer() {
            countdown = REFRESH_INTERVAL;
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                countdown--;
                document.getElementById('countdown').innerText = countdown;
                if (countdown <= 0) loadData();
            }, 1000);
        }

        async function fetchExtras() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDCUSDT');
                const data = await res.json();
                const p = parseFloat(data.price).toFixed(4);
                const el = document.getElementById('binance-price');
                el.innerText = p;
                el.className = p > 1.0005 ? "text-emerald-400 font-bold" : (p < 0.9995 ? "text-red-400 font-bold" : "text-white font-bold");
            } catch(e) {}

            try {
                const res = await fetch("https://gasstation.polygon.technology/v2");
                const data = await res.json();
                const gwei = Math.floor(data.fast.maxFee);
                document.getElementById('poly-gwei').innerText = `${gwei} Gwei`;
            } catch(e) {}
        }

        window.onload = () => {
            loadData();
            fetchExtras();
            document.getElementById('search-input').addEventListener('input', () => { currentPage=1; renderView(); });
            
            // FIX: Proper Category Rendering
            const catContainer = document.getElementById('category-filters');
            catContainer.innerHTML = '';
            ['All', 'Crypto', 'Politics', 'Sports'].forEach(c => {
                const btn = document.createElement('button');
                const isActive = c === (currentCategory === 'all' ? 'All' : currentCategory);
                btn.className = `category-chip px-3 py-1 rounded-full text-xs mr-2 ${isActive ? 'active' : ''}`;
                btn.innerText = c;
                btn.onclick = () => { 
                    currentCategory = c === 'All' ? 'all' : c; 
                    currentPage = 1; 
                    // Re-render buttons to update active state
                    Array.from(catContainer.children).forEach(child => {
                        child.classList.remove('active');
                        if (child.innerText === c) child.classList.add('active');
                    });
                    renderView(); 
                };
                catContainer.appendChild(btn);
            });
        };
        
        function refreshData() { loadData(); fetchExtras(); }
    </script>
</body>
</html>
